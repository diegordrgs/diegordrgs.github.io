<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="Personal — Diego Rodrigues">Pessoal — Diego Rodrigues</title>
  <meta name="description" data-en="A grid of photos and gifs — the stuff Diego Rodrigues gets up to outside of product design." content="Um mosaico de fotos e gifs — o que Diego Rodrigues faz fora do design de produto.">
  <style>
    @font-face{
      font-family:'Cabinet Grotesk';
      src:url('fonts/cabinet-grotesk/CabinetGrotesk-Variable.woff2') format('woff2');
      font-weight:100 900;
      font-display:swap;
      font-style:normal;
    }
    :root{
      --bg:#fff;--text:#111;--text-strong:#0a0a0a;--text-secondary:#555;--text-muted:#767676;--text-body:#444;
      --border:#e8e8e8;--border-light:#ccc;--surface:#f0f0f0;--nav-bg:rgba(255,255,255,.96);
      --accent:#2A5BD7;--cursor:#0a0a0a;--cursor-ring:rgba(17,17,17,.25);--accent-ring:rgba(42,91,215,.2);
    }
    :root[data-theme="dark"]{
      --bg:#0c0c0c;--text:#e6e6e6;--text-strong:#f5f5f5;--text-secondary:#b0b0b0;--text-muted:#8a8a8a;--text-body:#c4c4c4;
      --border:#2a2a2a;--border-light:#444;--surface:#1a1a1a;--nav-bg:rgba(12,12,12,.85);
      --accent:#5b8def;--cursor:#f5f5f5;--cursor-ring:rgba(255,255,255,.3);--accent-ring:rgba(91,141,239,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0;cursor:none}
    body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}

    .cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;background:var(--cursor);pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .15s,height .15s,background .2s}
    .cursor-ring{position:fixed;top:0;left:0;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--cursor-ring);pointer-events:none;z-index:99998;transform:translate(-50%,-50%)}
    .cursor-dot.hov{width:12px;height:12px;background:var(--accent)}
    .cursor-ring.hov{width:50px;height:50px;border-color:var(--accent-ring)}

    .pf-nav{position:sticky;top:0;z-index:200;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:20px 48px;display:flex;align-items:center;justify-content:space-between}
    .pf-nav-left{display:flex;align-items:baseline;gap:12px}
    .pf-logo{font-family:'Cabinet Grotesk',sans-serif;font-size:13px;font-weight:400;letter-spacing:.10em;text-transform:uppercase;color:var(--text-strong);text-decoration:none;cursor:none}
    .pf-nav-sep{color:var(--border-light);font-size:13px;font-weight:300}
    .pf-role{font-size:12px;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
    .pf-nav ul{display:flex;align-items:center;gap:28px;list-style:none}
    .pf-nav-link{font-size:12px;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;transition:color .2s;cursor:none}
    .pf-nav-link:hover{color:var(--text-strong)}
    .pf-nav-link.on{color:var(--accent);font-weight:500}
    .theme-toggle{background:none;border:none;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:var(--text-muted);cursor:none;transition:color .2s}
    .theme-toggle:hover{color:var(--text-strong)}
    .theme-toggle svg{width:16px;height:16px;display:block}
    .theme-toggle .icon-moon{display:none}
    [data-theme="dark"] .theme-toggle .icon-sun{display:none}
    [data-theme="dark"] .theme-toggle .icon-moon{display:block}
    .nav-toggle-item{display:flex;align-items:center}
    .lang-switch{display:flex;align-items:center;gap:6px}
    .lang-option{background:none;border:none;padding:0;margin:0;font-family:'Cabinet Grotesk',sans-serif;font-size:10px;font-weight:500;letter-spacing:.05em;color:var(--text-muted);cursor:none;transition:color .2s}
    .lang-option:hover{color:var(--text-strong)}
    .lang-option.active{color:var(--text-strong);font-weight:700}
    .lang-sep{font-size:10px;color:var(--border-light)}

    .menu-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:22px;height:16px;background:none;border:none;padding:0;cursor:none}
    .menu-toggle span{display:block;width:100%;height:1.5px;background:var(--text-strong)}
    .mobile-menu{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;padding:20px 24px;visibility:hidden;opacity:0;transition:opacity .3s ease,visibility .3s ease}
    .mobile-menu.open{visibility:visible;opacity:1}
    .mobile-menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-close{background:none;border:none;padding:0;width:24px;height:24px;color:var(--text-strong);cursor:none;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
    .mobile-menu-links{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:52px}
    .mobile-menu-links a{font-family:'Cabinet Grotesk',sans-serif;font-size:clamp(30px,10vw,42px);font-weight:700;letter-spacing:-.02em;color:var(--text-strong);text-decoration:none;cursor:none}
    .mobile-menu-links a.on{color:var(--accent)}
    .mobile-menu-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--border)}

    .wrap{width:100%;padding:0 48px}

    .fun-header{padding:56px 0 36px}
    .fun-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
    .fun-title{font-family:'Cabinet Grotesk',sans-serif;font-style:italic;font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--text-strong)}

    .fun-grid{columns:3 260px;column-gap:14px;padding-bottom:88px}
    .fun-item{break-inside:avoid;margin-bottom:14px;border-radius:16px;overflow:hidden;background:var(--surface);cursor:none}
    .fun-item img{width:100%;display:block}
    .fun-caption{padding:10px 14px 14px;font-size:12px;font-weight:400;color:var(--text-secondary);line-height:1.4}

    .fun-placeholder{width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px dashed var(--border-light)}
    .fun-placeholder span{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
    .fun-placeholder small{font-size:11px;color:var(--text-muted)}

    .pf-foot{border-top:1px solid var(--border);padding:28px 0;display:flex;align-items:center;justify-content:space-between}
    .pf-foot-left{display:flex;flex-direction:column;gap:4px}
    .pf-foot-cta{font-family:'Cabinet Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text-strong);letter-spacing:-.02em}
    .pf-foot-email{font-size:13px;color:var(--text-secondary);text-decoration:none;transition:color .2s;cursor:none}
    .pf-foot-email:hover{color:var(--text)}
    .pf-foot-links{display:flex;gap:20px}
    .pf-foot-links a{font-size:12px;color:var(--text-muted);text-decoration:none;transition:color .2s;cursor:none;letter-spacing:.04em}
    .pf-foot-links a:hover{color:var(--text)}

    @media (max-width:900px){.fun-grid{columns:2 220px}}
    @media (max-width:560px){.fun-grid{columns:2 130px;column-gap:10px}}

    @media (max-width:640px){
      .pf-nav{padding:16px 20px}
      .pf-nav>ul{display:none}
      .menu-toggle{display:flex}
      .wrap{padding:0 20px}
      .fun-header{padding:32px 0 24px}
      .fun-title{font-size:clamp(28px,9vw,44px)}
      .pf-foot{flex-direction:column;align-items:flex-start;gap:16px;padding:24px 0}
    }
  </style>
</head>

<script>
  const dot=document.getElementById('dot'),ring=document.getElementById('ring');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px'});
  (function anim(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(anim)})();
  document.querySelectorAll('a,.fun-item,.theme-toggle,.lang-option').forEach(el=>{
    el.addEventListener('mouseenter',()=>{dot.classList.add('hov');ring.classList.add('hov')});
    el.addEventListener('mouseleave',()=>{dot.classList.remove('hov');ring.classList.remove('hov')});
  });

  (function(){
    const btns=document.querySelectorAll('.theme-toggle');
    if(!btns.length)return;
    const root=document.documentElement;
    btns.forEach(btn=>{
      btn.addEventListener('click',()=>{
        const isDark=root.getAttribute('data-theme')==='dark';
        root.setAttribute('data-theme',isDark?'light':'dark');
        localStorage.setItem('theme',isDark?'light':'dark');
      });
    });
  })();

  (function(){
    const menuToggle=document.getElementById('menuToggle');
    const menuClose=document.getElementById('menuClose');
    const mobileMenu=document.getElementById('mobileMenu');
    if(!menuToggle||!mobileMenu)return;
    function openMenu(){mobileMenu.classList.add('open');document.body.style.overflow='hidden'}
    function closeMenu(){mobileMenu.classList.remove('open');document.body.style.overflow=''}
    menuToggle.addEventListener('click',openMenu);
    if(menuClose)menuClose.addEventListener('click',closeMenu);
    mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));
    window.addEventListener('resize',()=>{if(window.innerWidth>640)closeMenu()});
  })();

  (function(){
    function applyLang(lang){
      document.documentElement.lang=lang;
      document.querySelectorAll('[data-en]').forEach(el=>{
        if(el.dataset.pt===undefined)el.dataset.pt=el.innerHTML;
        el.innerHTML=lang==='en'?el.dataset.en:el.dataset.pt;
      });
      const titleEl=document.querySelector('title[data-en]');
      if(titleEl){
        if(titleEl.dataset.pt===undefined)titleEl.dataset.pt=titleEl.textContent;
        titleEl.textContent=lang==='en'?titleEl.dataset.en:titleEl.dataset.pt;
      }
      const metaDesc=document.querySelector('meta[name="description"][data-en]');
      if(metaDesc){
        if(metaDesc.dataset.pt===undefined)metaDesc.dataset.pt=metaDesc.getAttribute('content');
        metaDesc.setAttribute('content',lang==='en'?metaDesc.dataset.en:metaDesc.dataset.pt);
      }
      document.querySelectorAll('.lang-option').forEach(b=>{
        b.classList.toggle('active',b.dataset.lang===lang);
      });
      localStorage.setItem('lang',lang);
    }
    function detectLang(){
      const saved=localStorage.getItem('lang');
      if(saved)return saved;
      const nav=(navigator.language||navigator.userLanguage||'pt').toLowerCase();
      return nav.startsWith('en')?'en':'pt';
    }
    applyLang(detectLang());
    document.querySelectorAll('.lang-option').forEach(btn=>{
      btn.addEventListener('click',()=>applyLang(btn.dataset.lang));
    });
  })();
</script>
