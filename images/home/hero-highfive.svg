<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 22 200 134">
  <style>
    .hand{transform-box:fill-box;transform-origin:50% 100%;animation:clap 2.4s cubic-bezier(.5,0,.3,1) infinite}
    .lh{--a:-12deg;--b:13deg}
    .rh{--a:-12deg;--b:13deg}
    @keyframes clap{
      0%,8%{transform:rotate(var(--a))}
      30%{transform:rotate(var(--b))}
      34%{transform:rotate(calc(var(--b) - 3deg))}
      38%,62%{transform:rotate(var(--b))}
      88%,100%{transform:rotate(var(--a))}
    }
    .burst{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:pop 2.4s ease-out infinite}
    @keyframes pop{
      0%,28%{opacity:0;transform:scale(.4)}
      34%{opacity:1;transform:scale(1.1)}
      55%{opacity:1;transform:scale(1)}
      66%,100%{opacity:0;transform:scale(1)}
    }
    @media (prefers-reduced-motion:reduce){
      .hand{animation:none;transform:rotate(var(--b))}
      .burst{animation:none;opacity:1}
    }
  </style>
  <defs>
    <g id="hand">
      <path d="M-17 2 C-20 -18 -21 -38 -19 -60 L19 -60 C21 -38 19 -18 15 2 Z"/>
      <rect x="-19.5" y="-98" width="9.5" height="46" rx="4.75"/>
      <rect x="-9" y="-108" width="9.5" height="56" rx="4.75"/>
      <rect x="1.5" y="-105" width="9.5" height="53" rx="4.75"/>
      <rect x="12" y="-93" width="8.5" height="41" rx="4.25"/>
      <rect x="-9" y="-48" width="10" height="36" rx="5" transform="rotate(-38 -17 -12)"/>
    </g>
  </defs>
  <rect width="240" height="160" fill="#F3F1EC"/>
  <g class="burst" stroke="#EF7A45" stroke-width="3.2" stroke-linecap="round">
    <path d="M91 30l4 7M76 40l8 5M70 58l9 1M74 76l8-3"/>
  </g>
  <g class="burst" stroke="#F2C834" stroke-width="3.2" stroke-linecap="round">
    <path d="M149 30l-4 7M164 40l-8 5M170 58l-9 1M166 76l-8-3"/>
  </g>
  <g transform="translate(93 158)"><g class="hand lh" fill="#F5D348"><use href="#hand"/></g></g>
  <g transform="translate(147 158) scale(-1 1)"><g class="hand rh" fill="#EF7A45"><use href="#hand"/></g></g>
</svg>
